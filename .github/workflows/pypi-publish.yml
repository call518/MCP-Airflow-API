name: Publish Packages and GitHub Release on Tag

on:
  push:
    tags: ["*"]

permissions:
  contents: read

jobs:
  build:
    name: Test and Build Distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check Out Tagged Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set Up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.7.20"
          python-version: "3.12"
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Run Pytest
        run: uv run --frozen pytest -ra

      - name: Build Distributions
        run: uv build

      - name: Verify Tag and Distribution Versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --frozen python scripts/check_release.py "$RELEASE_TAG" dist

      - name: Upload Distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/mcp-airflow-api/
    permissions:
      id-token: write
    steps:
      - name: Download Distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish to PyPI
    needs: publish-to-testpypi
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/mcp-airflow-api/
    permissions:
      id-token: write
    steps:
      - name: Download Distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  release:
    name: Publish GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: github-release-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check Out Tagged Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Publish Release with Commit Messages
        run: python3 -m scripts.publish_release "$RELEASE_TAG"
